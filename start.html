<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WINZ Advocate — work out what you're owed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f3ec; --raise:#fffdf9; --ink:#221d17; --soft:#5f5749; --faint:#8a8071;
    --line:#e6ddcd; --clay:#bf4f2a; --clay-ink:#fff; --pine:#2f5d4f; --pine-soft:#e4efe9;
    --shadow:0 1px 2px rgba(34,29,23,.04), 0 10px 28px rgba(34,29,23,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#191510; --raise:#221d17; --ink:#f1eadd; --soft:#b6ab98; --faint:#8b8272;
      --line:#332b20; --clay:#e5734b; --clay-ink:#2a0f04; --pine:#74b7a1; --pine-soft:#22322c;
      --shadow:0 1px 2px rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box; margin:0}
  body{
    background:var(--paper); color:var(--ink); min-height:100vh;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:18px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  h1,h2{font-family:Fraunces,Georgia,serif; font-weight:600; line-height:1.15; letter-spacing:-.005em}
  .wrap{max-width:560px; margin:0 auto; padding:20px 20px 72px}
  .top{position:sticky; top:0; background:var(--paper); padding:14px 0 12px; z-index:5}
  .bar{height:8px; background:var(--line); border-radius:999px; overflow:hidden}
  .bar > i{display:block; height:100%; background:var(--pine); border-radius:999px; transition:width .35s ease}
  .steplabel{font-size:.82rem; color:var(--faint); margin-top:7px; display:flex; justify-content:space-between}
  .steplabel a{color:var(--faint)}
  .screen{margin-top:20px}
  .q{font-size:1.4rem; margin:0 0 6px; text-wrap:balance}
  .hint{color:var(--soft); font-size:.96rem; margin-bottom:18px}
  .choices{display:grid; gap:10px}
  button.choice{
    text-align:left; font:inherit; color:var(--ink); background:var(--raise);
    border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; cursor:pointer;
    display:flex; align-items:center; gap:12px; min-height:54px; box-shadow:var(--shadow);
  }
  button.choice:hover{border-color:var(--clay)}
  button.choice:active{transform:translateY(1px)}
  button.choice[aria-pressed="true"]{border-color:var(--pine); background:var(--pine-soft)}
  button.choice .tick{width:22px; height:22px; border-radius:50%; border:2px solid var(--faint); flex:none; display:grid; place-items:center; font-size:.8rem}
  /* square indicator for pick-many questions */
  .choices.multi button.choice .tick{border-radius:6px}
  button.choice[aria-pressed="true"] .tick{border-color:var(--pine); background:var(--pine); color:var(--paper)}
  .nav{display:flex; gap:10px; margin-top:24px}
  .btn{font:inherit; font-weight:600; border-radius:12px; padding:14px 20px; cursor:pointer; border:1.5px solid transparent}
  .btn-next{background:var(--clay); color:var(--clay-ink); flex:1}
  .btn-next[disabled]{opacity:.4; cursor:default}
  .btn-back{background:transparent; color:var(--soft); border-color:var(--line)}
  input.amount{font:inherit; width:100%; padding:15px 16px 15px 32px; border:1.5px solid var(--line); border-radius:12px; background:var(--raise); color:var(--ink)}
  .prefix{position:relative}
  .prefix span{position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--faint)}
  .result-h{font-size:1.7rem; margin:6px 0 4px}
  .checklist{display:grid; gap:12px; margin:18px 0}
  .item{background:var(--raise); border:1px solid var(--line); border-left:4px solid var(--pine); border-radius:12px; padding:14px 16px}
  .item.maybe{border-left-color:var(--faint)}
  .item.urgent{border-left-color:var(--clay)}
  .item h3{font-family:Inter,sans-serif; font-size:1.08rem; margin:0 0 3px}
  .item p{font-size:.95rem; color:var(--soft); margin:0}
  .badge{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--pine)}
  .item.maybe .badge{color:var(--faint)}
  .item.urgent .badge{color:var(--clay)}
  .actions-box{background:var(--pine-soft); border-radius:14px; padding:16px 18px; margin:18px 0}
  .actions-box ol{margin:8px 0 0; padding-left:20px}
  .actions-box li{margin:8px 0}
  details.draft{background:var(--raise); border:1px solid var(--line); border-radius:12px; padding:4px 16px; margin:10px 0}
  details.draft summary{padding:12px 0; cursor:pointer; font-weight:600}
  details.draft pre{white-space:pre-wrap; font:inherit; font-size:.9rem; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 0 14px; overflow-x:auto}
  .copy{font:inherit; font-weight:600; background:var(--pine); color:var(--paper); border:0; border-radius:10px; padding:10px 14px; cursor:pointer; margin-bottom:14px}
  .disclaim{font-size:.86rem; color:var(--faint); margin-top:22px; border-top:1px solid var(--line); padding-top:16px}
  a{color:var(--clay)}
  .cheer{color:var(--pine); font-size:.92rem; margin-top:14px; font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="bar"><i id="fill" style="width:0%"></i></div>
    <div class="steplabel"><span id="stepnum">Getting started</span><a href="./index.html">Exit</a></div>
  </div>
  <div id="app" class="screen"></div>
</div>

<script src="./wizard-logic.js"></script>
<script>
(function(){
  "use strict";

  var W = window.WIZARD;
  var Q = W.QUESTIONS;
  var num = W.helpers.num, onBenefit = W.helpers.onBenefit, has = W.helpers.has, single = W.helpers.single;

  var A = load(), pos = 0;
  function load(){ try{ return JSON.parse(localStorage.getItem("wa_answers")||"{}"); }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem("wa_answers", JSON.stringify(A)); }catch(e){} }
  function visible(){ return W.questionsForIntent(A); }

  function renderIntent(){
    document.getElementById("fill").style.width = "0%";
    document.getElementById("stepnum").textContent = "Start";
    var el = document.getElementById("app"); el.innerHTML="";
    var h=document.createElement("h1"); h.className="q"; h.textContent="What do you need help with?"; el.appendChild(h);
    var p=document.createElement("p"); p.className="hint"; p.textContent="Pick the closest. We'll only ask what that needs, then write the emails for you."; el.appendChild(p);
    var wrap=document.createElement("div"); wrap.className="choices"; el.appendChild(wrap);
    W.INTENTS.forEach(function(it){
      var b=document.createElement("button"); b.className="choice"; b.type="button";
      b.innerHTML='<span>'+it.label+'</span>';
      b.addEventListener("click", function(){ A._intent=it.id; W.applyIntent(A); save(); pos=0; render(); window.scrollTo(0,0); });
      wrap.appendChild(b);
    });
  }

  function render(){
    if(!A._intent) return renderIntent();
    var vis = visible();
    if(pos >= vis.length) return renderResults();
    var q = vis[pos];
    document.getElementById("fill").style.width = Math.round((pos/vis.length)*100)+"%";
    document.getElementById("stepnum").textContent = "Question "+(pos+1)+" of "+vis.length;
    var el = document.getElementById("app"); el.innerHTML="";
    var h=document.createElement("h1"); h.className="q"; h.textContent=q.q; el.appendChild(h);
    if(q.hint){ var p=document.createElement("p"); p.className="hint"; p.textContent=q.hint; el.appendChild(p); }

    if(q.type==="amount"){
      var box=document.createElement("div"); box.className="prefix";
      box.innerHTML='<span>$</span><input class="amount" inputmode="decimal" placeholder="0" value="'+(A[q.id]||"")+'">';
      el.appendChild(box);
      box.querySelector("input").addEventListener("input", function(e){ A[q.id]=e.target.value; save(); });
    } else {
      var wrap=document.createElement("div"); wrap.className="choices"+(q.multi?" multi":"");
      q.options.forEach(function(o){
        var b=document.createElement("button"); b.className="choice"; b.type="button";
        var chosen = q.multi ? has(A,q.id,o.v) : A[q.id]===o.v;
        b.setAttribute("aria-pressed", chosen?"true":"false");
        b.innerHTML='<span class="tick">'+(chosen?"✓":"")+'</span><span>'+o.t+'</span>';
        b.addEventListener("click", function(){
          if(q.multi){
            var cur = A[q.id]||[];
            if(o.clears){ A[q.id] = cur.includes(o.v) ? [] : [o.v]; }
            else { cur = cur.filter(function(x){return x!=="none";});
                   A[q.id] = cur.includes(o.v) ? cur.filter(function(x){return x!==o.v;}) : cur.concat([o.v]); }
            save(); render();
          } else { A[q.id]=o.v; save(); pos++; render(); window.scrollTo(0,0); }
        });
        wrap.appendChild(b);
      });
      el.appendChild(wrap);
    }

    var nav=document.createElement("div"); nav.className="nav";
    var back=document.createElement("button"); back.className="btn btn-back"; back.textContent="Back";
    back.onclick=function(){ if(pos>0){ pos--; } else { A._intent=null; save(); } render(); window.scrollTo(0,0); };
    nav.appendChild(back);
    if(q.type==="amount" || q.multi){
      var next=document.createElement("button"); next.className="btn btn-next"; next.textContent="Next";
      if(q.multi && !(A[q.id]||[]).length){ next.disabled=true; }
      next.onclick=function(){ pos++; render(); window.scrollTo(0,0); }; nav.appendChild(next);
    }
    el.appendChild(nav);
    if(pos>0 && pos===Math.floor(vis.length/2)){
      var c=document.createElement("p"); c.className="cheer"; c.textContent="You're about halfway. Keep going — the hard part's nearly done."; el.appendChild(c);
    }
  }

  function renderResults(){
    document.getElementById("fill").style.width="100%";
    document.getElementById("stepnum").textContent="Your results";
    var results = W.evaluate(A);

    var el=document.getElementById("app"); el.innerHTML="";
    var it = (W.INTENTS.filter(function(x){return x.id===A._intent;})[0]) || {label:""};
    var focused = results.filter(function(r){return r._focus;});
    var extra   = results.filter(function(r){return !r._focus;});

    var h=document.createElement("h1"); h.className="result-h";
    h.textContent = it.id && it.id!=="audit" && it.id!=="other" ? ("For: "+it.label) : "What you may be entitled to";
    el.appendChild(h);
    var sub=document.createElement("p"); sub.className="hint";
    sub.textContent="Based on what you told us. Guides, not decisions — amounts and rules change, so confirm with Work and Income. This tool never contacts them for you; you send everything.";
    el.appendChild(sub);

    function renderItems(arr){
      var list=document.createElement("div"); list.className="checklist";
      arr.forEach(function(r){
        var d=document.createElement("div"); d.className="item "+r.level;
        var label = r.level==="urgent" ? "Do this now" : r.level==="yes" ? "Worth applying" : "Worth checking";
        d.innerHTML='<div class="badge">'+label+'</div><h3>'+r.name+'</h3><p>'+r.why+'</p>'+
                    '<p style="margin-top:6px"><strong>What to do:</strong> '+r.doThis+'</p>';
        list.appendChild(d);
      });
      return list;
    }
    el.appendChild(renderItems(focused.length?focused:results));
    if(focused.length && extra.length){
      var eh=document.createElement("h2"); eh.style.fontSize="1.2rem"; eh.style.margin="22px 0 4px"; eh.textContent="Also worth checking while you're at it"; el.appendChild(eh);
      el.appendChild(renderItems(extra));
    }

    var actions=buildActions(A,results);
    var ab=document.createElement("div"); ab.className="actions-box";
    ab.innerHTML='<strong>Your next 3 things — in order</strong><ol>'+actions.map(function(x){return "<li>"+x+"</li>";}).join("")+'</ol>';
    el.appendChild(ab);

    var dh=document.createElement("h2"); dh.style.fontSize="1.3rem"; dh.style.margin="24px 0 6px"; dh.textContent="Emails ready for you to send"; el.appendChild(dh);
    var dhint=document.createElement("p"); dhint.className="hint"; dhint.textContent="Copy one, fill in the [square brackets], send it through MyMSD or to your service centre. Keep a copy. You send it — not us."; el.appendChild(dhint);
    buildDrafts(A,results).forEach(function(dr){
      var det=document.createElement("details"); det.className="draft";
      det.innerHTML='<summary>'+dr.title+'</summary><button class="copy">Copy this</button><pre>'+esc(dr.body)+'</pre>';
      det.querySelector(".copy").addEventListener("click", function(){ var btn=this; navigator.clipboard.writeText(dr.body).then(function(){ btn.textContent="Copied ✓"; }).catch(function(){}); });
      el.appendChild(det);
    });

    var cf=document.createElement("h2"); cf.style.fontSize="1.3rem"; cf.style.margin="24px 0 6px"; cf.textContent="Save your notes"; el.appendChild(cf);
    var cfbtn=document.createElement("button"); cfbtn.className="copy"; cfbtn.textContent="Copy my notes to keep";
    cfbtn.addEventListener("click", function(){ navigator.clipboard.writeText(caseFile(A,results)).then(function(){ cfbtn.textContent="Copied ✓ — paste it somewhere safe"; }).catch(function(){}); });
    el.appendChild(cfbtn);

    var more=document.createElement("p"); more.style.marginTop="20px";
    more.innerHTML='Unusual situation, a declined decision to fight, or a WINZ debt? <a href="./index.html#start">Use the full AI version</a> — it goes deeper and drafts anything.';
    el.appendChild(more);
    var again=document.createElement("p"); again.style.marginTop="14px"; again.innerHTML='<a href="#" id="restart">Start again</a>'; el.appendChild(again);
    document.getElementById("restart").onclick=function(e){ e.preventDefault(); A={}; save(); pos=0; render(); window.scrollTo(0,0); };

    var dis=document.createElement("p"); dis.className="disclaim";
    dis.innerHTML="Free, community-run, independent — not Work and Income, not the government. Not legal advice. If WINZ accuses you of fraud, get a lawyer through Community Law. If you're not coping: free call or text <strong>1737</strong>, or <strong>111</strong> in an emergency.";
    el.appendChild(dis);
    window.scrollTo(0,0);
  }

  function buildActions(a, results){
    var out=[];
    if(results.some(function(r){return r.level==="urgent";}))
      out.push("<strong>Today:</strong> phone <strong>0800 559 009</strong> about the urgent items above. Say what you need and how much.");
    if((a.trouble||[]).includes("declined") && a.declined_when!=="longer")
      out.push("<strong>This week (there's a deadline):</strong> lodge a Review of Decision for the declined decision.");
    if(!onBenefit(a) && a.age!=="65")
      out.push("<strong>This week:</strong> start your main benefit application on MyMSD (my.msd.govt.nz).");
    if(["rent_private","board","own"].includes(a.housing) && !has(a,"already","as"))
      out.push("<strong>This week:</strong> book a phone appointment to apply for Accommodation Supplement — bring your tenancy/board agreement.");
    if((a.health==="long"||a.health==="severe") && out.length<3)
      out.push("<strong>Soon:</strong> book a longer GP appointment for a Disability Certificate listing your health costs.");
    if(a.kids && a.kids!=="none" && a.kids!=="whangai" && out.length<3)
      out.push("<strong>Soon:</strong> register for Working for Families on myIR at ird.govt.nz.");
    if(!out.length) out.push("Book a phone appointment with WINZ to go through everything on this list.");
    return out.slice(0,3);
  }

  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  function buildDrafts(a, results){
    var names = results.map(function(r){return r.name;});
    var drafts=[];
    var u=(a.urgent||[]).filter(function(x){return x!=="none";});
    if(u.length){
      drafts.push({ title:"Urgent help + appointment request", body:
"Subject: Urgent assistance request and appointment request — [Full name], client number [number]\n\n"+
"Kia ora,\n\nMy name is [Full name], client number [number], date of birth [DD/MM/YYYY].\n\n"+
"I need urgent help this week with: "+u.map(function(x){return {food:"food",power:"power arrears",rent:"rent arrears",housing:"emergency housing"}[x];}).join(", ")+".\n"+
"I have no other way to pay for this. Money in my accounts: $"+(a.bank||"[amount]")+", committed to [rent / power / debt] and not available.\n\n"+
"I would also like a phone appointment to check I am receiving everything I am entitled to. Based on my situation, please check:\n"+
names.map(function(n){return "  - "+n;}).join("\n")+"\n\n"+
"Please tell me what you need to process the urgent help today, and the appointment date and time. I would like to bring a support person.\n\n"+
"Ngā mihi,\n[Full name]\n[phone] · [email]" });
    } else {
      drafts.push({ title:"Appointment request — full entitlement check", body:
"Subject: Appointment request — checking my full entitlements — [Full name], client number [number]\n\n"+
"Kia ora,\n\nMy name is [Full name], client number [number], date of birth [DD/MM/YYYY].\n\n"+
"I would like a phone appointment to make sure I am receiving everything I am entitled to. Please check:\n"+
names.map(function(n){return "  - "+n;}).join("\n")+"\n\n"+
"Please let me know the date and time. I would like to bring a support person.\n\n"+
"Ngā mihi,\n[Full name]\n[phone] · [email]" });
    }
    if((a.trouble||[]).includes("declined")){
      drafts.push({ title:"Review of Decision request", body:
"Subject: Application for Review of Decision — [Full name], client number [number]\n\n"+
"Kia ora,\n\nI am applying for a review of the following decision.\n\n"+
"- My name: [Full name]\n- Client number: [number]\n- Date of birth: [DD/MM/YYYY]\n"+
"- Decision I am challenging: [describe it — e.g. the decision to decline my application for X]\n"+
"- Date I was notified: [DD/MM/YYYY]"+(a.declined_when==="longer"?"  (This is more than three months ago. The reason for the delay is [reason — e.g. I was unwell / did not know there was a time limit].)":"")+"\n\n"+
"Why I believe the decision is wrong:\n[Plain, factual points. Attach any evidence — a letter from your doctor, proof of a cost, a record of what you were told.]\n\n"+
"What I think the correct decision is:\n[e.g. That I am granted X from [date].]\n\n"+
"I would like to attend the review by phone, with a support person. Please also send me the information on my file relevant to this decision.\n\n"+
"Ngā mihi,\n[Full name]\n[phone] · [email] · [date]" });
    }
    if((a.trouble||[]).includes("delay")){
      drafts.push({ title:"Follow-up on a delay", body:
"Subject: Follow-up on [what you applied for] — [Full name], client number [number]\n\n"+
"Kia ora,\n\nOn [date] I applied for [what you applied for] [reference number if you have one]. I was told to expect a decision by [date/timeframe], and I have not had one.\n\n"+
"This is causing [short factual impact — e.g. I cannot cover this week's food and power].\n\n"+
"Please: 1) tell me the current status, 2) tell me if anything further is needed from me, 3) give me a date for the decision. If a decision has been made, please send it in writing with the reasons.\n\n"+
"Ngā mihi,\n[Full name]\n[phone] · [email]" });
    }
    if(a.debt==="yes"){
      drafts.push({ title:"Debt: ask for the breakdown", body:
"Subject: Request for breakdown of alleged overpayment — [Full name], client number [number]\n\n"+
"Kia ora,\n\nI have a letter dated [date] saying I was overpaid [$amount] for the period [dates].\n\n"+
"Before anything is deducted or agreed, please send me in writing: how it was calculated (week by week), what income or change it is based on and the source, the exact period, and which rule it relies on. Please pause any deductions until I have checked this.\n\n"+
"Ngā mihi,\n[Full name]\n[phone] · [email]" });
    }
    if(results.some(function(r){return r.name.indexOf("Disability Allowance")===0;})){
      drafts.push({ title:"Ask your GP for a Disability Certificate", body:
"Kia ora [Dr name],\n\nI'm applying to Work and Income for a Disability Allowance. It needs a Disability Certificate from you confirming:\n  - my condition, and that it has lasted / will last 6 months or more\n  - the regular costs it causes me\n\n"+
"My regular health-related costs:\n  - GP visits: $[amount], about [how often]\n  - Prescriptions: $[amount]\n  - [counselling / physio / travel / extra heating / special food]: $[amount]\n\n"+
"Could we book a longer appointment so there's time to complete it properly? Thank you.\n\n[Full name] · [DOB] · [phone]" });
    }
    return drafts;
  }

  function caseFile(a, results){
    var L=["MY WINZ ADVOCATE NOTES","(keep this — paste it back next time)","Updated: "+new Date().toLocaleDateString("en-NZ"),"","MY SITUATION"];
    L.push("- Income: "+({benefit:"a benefit",wages:"wages",both:"benefit + wages",nothing:"nothing"}[a.income]||"[?]")+(a.which_benefit?" ("+a.which_benefit+")":""));
    L.push("- Age band: "+(a.age||"[?]")+"   |   "+(single(a)?"on my own":"have a partner"));
    L.push("- Children: "+({none:"none",one_young:"youngest under 3",one_u14:"youngest 3-13",teen:"all 14+",whangai:"caring for a child not mine"}[a.kids]||"[?]"));
    L.push("- Housing: "+({rent_private:"private rental",board:"boarding",kaingaora:"Kāinga Ora/community",own:"own home w/ mortgage",staying:"with family/friends",nofixed:"no fixed place"}[a.housing]||"[?]")+", $"+(a.housingcost||"0")+"/wk");
    L.push("- Health: "+({no:"none",short:"short-term",long:"6+ months",severe:"severe long-term"}[a.health]||"[?]"));
    L.push("- Money in bank: about $"+(a.bank||"[?]")+"   |   WINZ debt: "+({yes:"yes",no:"no",notsure:"unsure"}[a.debt]||"[?]"));
    L.push("- Residency: "+({yes:"citizen/resident",visa:"on a visa",unsure:"unsure"}[a.resident]||"[?]"));
    if((a.trouble||[]).filter(function(x){return x!=="none";}).length) L.push("- Trouble: "+(a.trouble||[]).filter(function(x){return x!=="none";}).join(", "));
    L.push("","TO APPLY FOR / CHECK");
    results.forEach(function(r){ L.push("- [ ] "+r.name+"  ("+(r.level==="urgent"?"do now":r.level==="yes"?"worth applying":"worth checking")+")"); });
    L.push("","CORRESPONDENCE LOG (date | sent/received | what | reference #)","- ","","DEADLINES (what | by when)","- ");
    if((a.trouble||[]).includes("declined")) L.push("- Review of Decision — within 3 months of the letter date");
    return L.join("\n");
  }

  render();
})();
</script>
</body>
</html>
